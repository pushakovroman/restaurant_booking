name: Build Windows EXE (Qt6 + SQLite)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Build Project and Deploy
        shell: pwsh
        run: |
          # 1. Находим папку с CMakeLists.txt
          $cmakeItem = Get-ChildItem -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1
          if (-not $cmakeItem) {
            Write-Error "CMakeLists.txt не найден!"
            exit 1
          }
          cd $cmakeItem.DirectoryName

          # 2. Компилируем проект
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

          # 3. Создаем папку для готового релиза в корне репозитория
          $outDir = "$env:GITHUB_WORKSPACE/release_dist"
          New-Item -ItemType Directory -Force -Path $outDir

          # 4. Копируем исполняемый .exe
          $exeItem = Get-ChildItem -Path "build" -Filter "RestaurantBookingApp.exe" -Recurse | Select-Object -First 1
          Copy-Item $exeItem.FullName -Destination $outDir

          # 5. Копируем базу данных SQLite
          $dataItem = Get-ChildItem -Directory -Filter "data" -Recurse | Select-Object -First 1
          if ($dataItem) {
            Copy-Item -Recurse -Force $dataItem.FullName -Destination "$outDir/data"
          }

          # 6. Копируем все необходимые dll-библиотеки Qt и плагины
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw "$outDir/RestaurantBookingApp.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantBooking_Windows_x64
          path: release_dist
